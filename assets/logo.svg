<!-- Computer Use 插件圖示：高對比度、透明背景、預留 10% 邊距的方形 SVG 圖示 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <!-- Outer Monitor Frame (with ~10% margin: x=14..114, y=16..96) -->
  <rect x="16" y="18" width="96" height="72" rx="10" stroke="#38BDF8" stroke-width="6" fill="#0F172A" fill-opacity="0.85"/>
  <!-- Top Window Bar -->
  <line x1="16" y1="34" x2="112" y2="34" stroke="#38BDF8" stroke-width="4"/>
  <circle cx="28" cy="26" r="3" fill="#F43F5E"/>
  <circle cx="38" cy="26" r="3" fill="#FBBF24"/>
  <circle cx="48" cy="26" r="3" fill="#34D399"/>
  <!-- Monitor Stand -->
  <path d="M52 90 L46 108 H82 L76 90" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="40" y1="108" x2="88" y2="108" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
  <!-- Background Virtual Cursor (AI Ghost Pointer) -->
  <path d="M68 44 L94 56 L81 61 L88 75 L81 78 L74 64 L66 72 Z" fill="#A855F7" stroke="#F8FAFC" stroke-width="3" stroke-linejoin="round"/>
  <!-- Pulse Ring around Virtual Cursor -->
  <circle cx="68" cy="44" r="8" stroke="#34D399" stroke-width="3" stroke-dasharray="4 3"/>
</svg>
